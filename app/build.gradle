plugins {
    id 'com.android.application'
}

android {
    namespace 'it.myrmm.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'it.myrmm.mobile'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.2.1'
    }

    // Firma stabile se il workflow passa la chiave (segreti del repository); altrimenti la chiave di debug.
    def ksFile = System.getenv('KEYSTORE_FILE')
    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
