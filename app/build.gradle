plugins {
    id 'com.android.application'
}

android {
    namespace 'it.myrmm.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'it.myrmm.mobile'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // firmato con la chiave di debug: installabile a mano, senza Play Store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
